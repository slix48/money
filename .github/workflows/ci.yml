name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: moneyos
          POSTGRES_USER: moneyos
          POSTGRES_PASSWORD: moneyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneyos -d moneyos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://moneyos:moneyos@localhost:5432/moneyos?schema=public
      UPGRADE_DATABASE_URL: postgresql://moneyos:moneyos@localhost:5432/moneyos_upgrade?schema=public
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      PROVIDER_TOKEN_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      APP_URL: https://ci.moneyos.invalid
      DEMO_MODE: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - run: npm run db:generate
      - name: Create upgrade database
        env:
          PGPASSWORD: moneyos
        run: createdb -h localhost -U moneyos moneyos_upgrade
      - name: Verify empty and upgrade migration paths
        run: npm run db:verify:migrations
      - name: Verify seed
        run: npm run db:seed
      - name: PostgreSQL integration tests
        env:
          TEST_POSTGRES: "true"
        run: npm run test:postgres
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        env:
          DEMO_MODE: "true"
        run: npm run test
      - name: Verify production environment contract
        env:
          NODE_ENV: production
        run: npm run verify:production-env
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
