services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moneyos
      POSTGRES_USER: moneyos
      POSTGRES_PASSWORD: moneyos
    ports:
      - "5432:5432"
    volumes:
      - moneyos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyos -d moneyos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moneyos-postgres:
